<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>povo Code Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 10;
      }
      .stat span {
        font-size: 12px;
        color: var(--mu);
      }
      .stat.w b {
        color: var(--wn);
      }
      .stat.e b {
        color: var(--ex);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .card.tap {
        cursor: pointer;
      }
      .nm {
        font-weight: 600;
      }
      .sub {
        font-size: 13px;
        color: var(--mu);
        font-variant-numeric: tabular-nums;
      }
      .cd.w {
        color: var(--wn);
      }
      .cd.e {
        color: var(--ex);
      }
      .t-u {
        background: var(--ob);
        color: var(--ok);
      }
      .t-w {
        background: var(--wb);
        color: var(--wn);
      }
      .t-e {
        background: var(--eb);
        color: var(--ex);
      }
      .t-d {
        background: var(--ln);
        color: var(--mu);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .bar {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-bottom: 10px;
        padding-bottom: 2px;
      }
      .chip.on {
        background: var(--ac);
        color: var(--on);
        border-color: var(--ac);
      }
      nav button.on {
        color: var(--ink);
        font-weight: 700;
        box-shadow: inset 0 3px 0 var(--ac);
      }
      .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 8px 16px;
        border-radius: 99px;
        z-index: 40;
        font-size: 14px;
      }
      .kv {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 4px 8px;
        font-size: 14px;
        margin-top: 8px;
      }
      .kv dt {
        color: var(--mu);
      }
      .kv dd {
        margin: 0;
        word-break: break-all;
      }
      .mask {
        filter: blur(5px);
      }
      .codewrap {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .codewrap .code {
        min-width: 0;
        flex: 1;
      }
      .codewrap .btn {
        flex: none;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 "Hiragino Sans",
          "Noto Sans JP",
          system-ui,
          sans-serif;
        padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        letter-spacing: 0.01em;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 24px;
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 14px;
        letter-spacing: 0.02em;
        font-weight: 800;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 10px;
      }
      .stat,
      .card {
        border-radius: var(--r);
        box-shadow: var(--sh);
      }
      .card.s-unused {
        border-left-color: var(--ok);
      }
      .card.s-near {
        border-left-color: var(--wn);
      }
      .card.s-expired {
        border-left-color: var(--ex);
      }
      .code {
        font:
          600 16px ui-monospace,
          Menlo,
          monospace;
        word-break: break-all;
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 10px 12px;
        margin: 8px 0;
        letter-spacing: 0.04em;
      }
      .btn.sm {
        padding: 4px 12px;
        min-height: 34px;
        font-size: 14px;
        border-radius: 10px;
      }
      nav button {
        flex: 1;
        border: 0;
        background: none;
        padding: 8px 0 10px;
        font-size: 11px;
        color: var(--mu);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        box-shadow: none !important;
      }
      nav button svg {
        width: 52px;
        height: 30px;
        padding: 3px 14px;
        box-sizing: border-box;
        border-radius: 99px;
        transition: background 0.15s;
      }
      nav button.on svg {
        background: var(--ac);
        color: var(--on);
      }
      nav button.on span {
        font-weight: 700;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: var(--mu);
        margin: 14px 0 5px;
        font-weight: 600;
      }
      input[type="checkbox"] {
        min-height: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      .home-section {
        border: 1px solid var(--section-border);
        border-radius: 14px;
        padding: 12px;
        margin: 12px 0 16px;
        background: var(--section-bg);
      }

      .home-section.active-section {
        --section-bg: var(--active-bg);
        --section-border: var(--active-border);
      }

      .home-section.stock-section {
        --section-bg: var(--stock-bg);
        --section-border: var(--stock-border);
      }

      .home-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 750;
        color: var(--ink);
      }
      .home-section-count {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--section-border);
        color: var(--ink);
        white-space: nowrap;
      }
      .home-section .card {
        border-bottom: 1px solid var(--section-border);
        padding: 12px 2px;
      }
      .home-section .card:last-child {
        border-bottom: 0;
        padding-bottom: 2px;
      }
      .home-section .empty {
        border-color: var(--section-border);
        background: transparent;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);

        --active-bg: #fff8df;
        --active-border: #ebd99a;
        --active-accent: transparent;

        --stock-bg: #eef4ff;
        --stock-border: #c7d8f4;
        --stock-accent: transparent;

        --bg: #f5f6f8;

        --sf: #fff;
        --ink: #14213d;
        --mu: #667085;
        --ln: #e3e6eb;
        --ac: #2457c5;
        --on: #fff;
        --wn: #b45309;
        --wb: #fef0dc;
        --ex: #b42318;
        --eb: #fde8e6;
        --ok: #1f7a3d;
        --ob: #e3f3e7;
        --r: 16px;
        --sh: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --active-bg: #14271b;
          --active-border: #315b3d;
          --active-accent: #70c88b;
          --stock-bg: #172337;
          --stock-border: #344d72;
          --stock-accent: #80aef5;
          --bg: #0f1218;
          --sf: #171b23;
          --ink: #eceff4;
          --mu: #98a2b3;
          --ln: #2a303b;
          --ac: #6b9bff;
          --on: #0f1218;
          --wn: #f5b66b;
          --wb: #3a2a15;
          --ex: #ff8d8d;
          --eb: #3c1a1a;
          --ok: #7fd297;
          --ob: #17301c;
        }
      }
      :root[data-theme="dark"] {
        --active-bg: #14271b;
        --active-border: #315b3d;
        --active-accent: #70c88b;
        --stock-bg: #172337;
        --stock-border: #344d72;
        --stock-accent: #80aef5;
        --bg: #0f1218;
        --sf: #171b23;
        --ink: #eceff4;
        --mu: #98a2b3;
        --ln: #2a303b;
        --ac: #6b9bff;
        --on: #0f1218;
        --wn: #f5b66b;
        --wb: #3a2a15;
        --ex: #ff8d8d;
        --eb: #3c1a1a;
        --ok: #7fd297;
        --ob: #17301c;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--ac);
        color: var(--on);
        display: none;
        place-items: center;
        font-weight: 800;
        font-size: 18px;
        flex: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 14px;
      }
      .brand h1,
      h1 {
        font-size: 20px;
        font-weight: 700;
      }
      h2 {
        font-size: 13px;
        margin: 22px 0 6px;
        color: var(--mu);
        font-weight: 600;
        letter-spacing: 0;
      }
      .stat {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 12px;
        box-shadow: none;
      }
      .stat b {
        display: block;
        font-size: 28px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .stat.big {
        background: var(--sf);
        color: var(--ink);
        border-color: var(--ln);
      }
      .stat.big b {
        color: var(--ac);
      }
      .stat.big span {
        color: var(--mu);
        opacity: 1;
      }

      .card {
        background: none;
        border: 0;
        border-radius: 0;
        padding: 12px 2px;
        margin-bottom: 8px;
        transition: transform 0.12s;
        border-left-width: 1px;
        border-bottom: 1px solid var(--ln);
        box-shadow: none;
        margin: 0;
      }

      /* コード一覧・履歴のカードデザイン */
      #lst .card,
      .history-card {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: none;
      }

      .card[class*=" s-"] {
        border-left-width: 0;
      }
      .card.s-used {
        border-left-color: var(--mu);
        opacity: 0.85;
      }
      .card.tap:active {
        transform: none;
        background: var(--ln);
      }
      .btn {
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        min-height: 42px;
        font-weight: 500;
        transition: transform 0.12s;
      }
      .btn:active {
        transform: none;
      }
      .btn.p {
        background: var(--ac);
        color: var(--on);
        border-color: var(--ac);
        font-weight: 600;
      }
      .btn[data-close] {
        background: none;
        border-color: transparent;
        color: var(--mu);
      }
      .btn.d {
        color: var(--ex);
        border-color: var(--ex);
      }
      .add {
        width: 100%;
        margin-top: 14px;
        position: static;
        bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        min-height: 46px;
        border-radius: 8px;
        font-size: 15px;
        box-shadow: none;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 9px 12px;
        min-height: 46px;
      }
      .chip {
        flex: none;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 99px;
        padding: 5px 12px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
      }
      .tag {
        display: inline-block;
        font-size: 11.5px;
        padding: 2px 9px;
        border-radius: 4px;
        font-weight: 600;
      }
      .cd {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        text-align: center;
        color: var(--mu);
        padding: 28px 12px;
        background: none;
        border: 1px dashed var(--ln);
        border-radius: 8px;
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        background: var(--sf);
        border-top: 1px solid var(--ln);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        z-index: 20;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      nav button svg,
      nav button.on svg {
        background: none;
        width: 24px;
        height: 24px;
        padding: 0;
        border-radius: 0;
      }
      nav button.on,
      nav button.on svg {
        color: var(--ac);
      }
      .sheet {
        background: var(--bg);
        width: 100%;
        max-width: 560px;
        max-height: 92%;
        overflow: auto;
        border-radius: 14px 14px 0 0;
        padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .sheet.c {
        border-radius: 12px;
        margin: auto 16px;
        max-height: 80%;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 30;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .warn {
        background: var(--wb);
        color: var(--wn);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      input,
      select,
      textarea {
        font-size: 16px !important;
      }
      input[type="datetime-local"],
      input[type="time"] {
        -webkit-appearance: none;
        appearance: none;
        min-width: 0;
        max-width: 100%;
        display: block;
      }
      .cd {
        white-space: nowrap;
        flex: none;
      }
      .foot {
        flex-wrap: wrap;
      }
      .foot-btns {
        display: flex;
        gap: 6px;
        flex: none;
        margin-left: auto;
      }
      .foot-btns .btn {
        white-space: nowrap;
      }
    </style>

    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="theme-color" content="#071329" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ぽぼると" />
  </head>
  <body>
    <main id="app"></main>
    <nav id="nav"></nav>
    <div id="layer"></div>
    <script>
      (function () {
        var DB = null,
          mem = { codes: [], meta: {} },
          codes = [],
          S = { near: 24, mask: true },
          view = "home",
          q = "",
          flt = "all",
          sort = "exp",
          prod = "",
          revealed = {},
          revealTimers = {};
        var $ = function (s) {
          return document.querySelector(s);
        };
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        /* ---- storage ---- */
        function open() {
          return new Promise(function (res) {
            try {
              var r = indexedDB.open("povo-code-manager", 1);
              r.onupgradeneeded = function () {
                var d = r.result;
                d.createObjectStore("codes", { keyPath: "id" });
                d.createObjectStore("meta");
              };
              r.onsuccess = function () {
                DB = r.result;
                res();
              };
              r.onerror = function () {
                res();
              };
            } catch (e) {
              res();
            }
          });
        }
        function loadAll() {
          return new Promise(function (res) {
            if (!DB) {
              codes = mem.codes.slice();
              res();
              return;
            }
            try {
              var r = DB.transaction("codes").objectStore("codes").getAll();
              r.onsuccess = function () {
                codes = r.result || [];
                var m = DB.transaction("meta").objectStore("meta").get("settings");
                m.onsuccess = function () {
                  if (m.result) S = Object.assign(S, m.result);
                  res();
                };
                m.onerror = function () {
                  res();
                };
              };
              r.onerror = function () {
                res();
              };
            } catch (e) {
              res();
            }
          });
        }
        /* ---- logic ---- */
        function st(c, now) {
          if (c.status === "used") return "used";
          return new Date(c.expiry).getTime() <= now ? "expired" : "unused";
        }
        function left(c, now) {
          return new Date(c.expiry).getTime() - now;
        }
        function near(c, now) {
          return st(c, now) === "unused" && left(c, now) <= S.near * 3600000;
        }
        function fmt(ms) {
          if (ms <= 0) return "期限切れ";
          var s = Math.floor(ms / 1000),
            d = Math.floor(s / 86400),
            h = Math.floor((s % 86400) / 3600),
            m = Math.floor((s % 3600) / 60),
            x = s % 60;
          if (d > 0) return d + "日" + h + "時間";
          if (h > 0) return h + "時間" + String(m).padStart(2, "0") + "分";
          return m + "分" + String(x).padStart(2, "0") + "秒";
        }
        function fd(t) {
          if (!t) return "—";
          var d = new Date(t),
            p = function (n) {
              return String(n).padStart(2, "0");
            };
          return (
            d.getFullYear() +
            "/" +
            p(d.getMonth() + 1) +
            "/" +
            p(d.getDate()) +
            " " +
            p(d.getHours()) +
            ":" +
            p(d.getMinutes())
          );
        }
        function loc(t) {
          var d = t ? new Date(t) : new Date(),
            p = function (n) {
              return String(n).padStart(2, "0");
            };
          return (
            d.getFullYear() +
            "-" +
            p(d.getMonth() + 1) +
            "-" +
            p(d.getDate()) +
            "T" +
            p(d.getHours()) +
            ":" +
            p(d.getMinutes())
          );
        }
        function uid() {
          return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }
        function toast(m) {
          var t = document.createElement("div");
          t.className = "toast";
          t.textContent = m;
          document.body.appendChild(t);
          setTimeout(function () {
            t.remove();
          }, 1600);
        }
        function copy(text) {
          var done = function () {
            toast("✓ コピーしました");
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fb);
          } else fb();
          function fb() {
            var a = document.createElement("textarea");
            a.value = text;
            document.body.appendChild(a);
            a.select();
            try {
              document.execCommand("copy");
              done();
            } catch (e) {
              toast("コピーできませんでした");
            }
            a.remove();
          }
        }
        /* ---- views ---- */
        function render() {
          var now = Date.now(),
            h = "",
            app = $("#app");
          $("#nav").innerHTML = [
            ["home", "ホーム", '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'],
            ["list", "コード", '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 10h8M8 14h5"/>'],
            ["hist", "履歴", '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
            [
              "set",
              "設定",
              '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
            ]
          ]
            .map(function (v) {
              return (
                '<button data-v="' +
                v[0] +
                '" class="' +
                (view === v[0] ? "on" : "") +
                '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                v[2] +
                "</svg><span>" +
                v[1] +
                "</span></button>"
              );
            })
            .join("");
          if (view === "home") {
            var un = codes.filter(function (c) {
                return st(c, now) === "unused";
              }),
              nr = un
                .filter(function (c) {
                  return near(c, now);
                })
                .sort(function (a, b) {
                  return a.expiry < b.expiry ? -1 : 1;
                }),
              ex = codes.filter(function (c) {
                return st(c, now) === "expired";
              });
            h +=
              '<div class="brand"><span class="logo">p</span><h1>povo vault</h1></div><div class="stats"><div class="stat big"><b>' +
              un.length +
              '</b><span>未使用</span></div><div class="stat w"><b>' +
              nr.length +
              '</b><span>期限が近い</span></div><div class="stat"><b>' +
              codes.filter(function (c) {
                return c.status === "used";
              }).length +
              "</b><span>使用済み</span></div></div>" +
              purchaseStats(now) +
              (ex.length

                "（" +
                n +
                "件）";
          }
          $("#b-price").oninput = pp;
          $("#b-div").oninput = function () {
            this.dataset.t = 1;
            pp();
          };
          $("#b-pm").onchange = pp;
          $("#b-pv").onchange = pp;
          $("#b-go").onclick = function () {
            var chk = Array.from(document.querySelectorAll("#b-pv input[data-i]:checked"))
              .map(function (x) {
                return found[+x.dataset.i];
              })
              .filter(function (c, i, a) {
                return (
                  a.indexOf(c) === i &&
                  !codes.some(function (x) {
                    return x.code.toUpperCase() === c.toUpperCase();
                  })
                );
              });
            var n = $("#b-name").value.trim(),
              e = $("#b-exp").value;
            if (!chk.length || !n || !e || isNaN(new Date(e).getTime())) {
              $("#err").textContent = "コード・商品名・有効な有効期限を入力してください。";
              return;
            }
            if ($("#b-pm").value === "total" && (+$("#b-div").value || chk.length) < chk.length) {
              $("#err").textContent = "割る数は登録件数以上にしてください。";
              return;
            }
            var base = Date.now(),
              amt = splitPrice($("#b-price").value, $("#b-pm").value, chk.length, +$("#b-div").value || chk.length);
            Promise.all(
              chk.map(function (cd, i) {
                return put({
                  id: uid(),
                  name: n,
                  code: cd,
                  expiry: new Date(e).toISOString(),
                  boughtAt: "",
                  price: amt[i],
                  memo: $("#b-memo").value,
                  dur: parseFloat($("#b-dur").value) || 0,
                  gb: $("#b-gb").value,
                  status: "unused",
                  usedAt: null,
                  createdAt: new Date(base + i).toISOString()
                });
              })
            ).then(
              function () {
                close();
                render();
                toast(chk.length + "件を登録しました");
              },
              function () {
                $("#err").textContent = "保存に失敗しました。もう一度お試しください。";
              }
            );
          };
        }
        function save(id) {
          var n = $("#f-name").value.trim(),
            cd = $("#f-code").value.trim(),
            e = $("#f-exp").value;
          if (!n || !cd || !e || isNaN(new Date(e).getTime())) {
            $("#err").textContent = "商品名・コード・有効な有効期限は必須です。";
            return;
          }
          if (
            codes.some(function (x) {
              return x.id !== id && x.code.replace(/\s/g, "").toUpperCase() === cd.replace(/\s/g, "").toUpperCase();
            })
          ) {
            $("#err").textContent = "このコードはすでに登録されています。";
            return;
          }
          var old =
              codes.find(function (x) {
                return x.id === id;
              }) || {},
            b = $("#f-buy").value,
            o = Object.assign({ status: "unused", usedAt: null, createdAt: new Date().toISOString() }, old, {
              id: old.id || uid(),
              name: n,
              code: cd,
              expiry: new Date(e).toISOString(),
              boughtAt: b ? new Date(b).toISOString() : "",
              price: $("#f-price").value,
              memo: $("#f-memo").value,
              dur: parseFloat($("#f-dur").value) || 0,
              gb: $("#f-gb").value,
              usedAt:
                $("#f-used") && $("#f-used").value ? new Date($("#f-used").value).toISOString() : old.usedAt || null
            });
          if (o.status === "used" && o.usedAt) o.endAt = calcEnd(o, new Date(o.usedAt).getTime());
          put(o).then(
            function () {
              close();
              render();
              toast("保存しました");
            },
            function () {
              $("#err").textContent =
                "保存に失敗しました。端末の空き容量やプライベートブラウズの設定を確認してください。";
            }
          );
        }
        function detail(id) {
          var c = codes.find(function (x) {
            return x.id === id;
          });
          if (!c) return;
          var now = Date.now();
          sheet(
            '<div class="row"><h1 style="margin:0">' +
              esc(c.name) +
              "</h1>" +
              tag(c, now) +
              "</div>" +
              codeView(c, "") +
              (cd(c, now) ? '<div style="margin:6px 0">' + cd(c, now) + "</div>" : "") +
              '<dl class="kv"><dt>有効期限</dt><dd>' +
              fd(c.expiry) +
              "</dd><dt>購入日</dt><dd>" +
              fd(c.boughtAt) +
              "</dd><dt>金額</dt><dd>" +
              (c.price !== "" && c.price != null ? "¥" + Number(c.price).toLocaleString() : "—") +
              "</dd><dt>登録日時</dt><dd>" +
              fd(c.createdAt) +
              "</dd><dt>使用日時</dt><dd>" +
              fd(c.usedAt) +
              "</dd><dt>データ量</dt><dd>" +
              gbTxt(c) +
              "</dd><dt>使用可能期間</dt><dd>" +
              (durOf(c) ? durTxt(durOf(c)) : "—") +
              "</dd><dt>使用期間の終了</dt><dd>" +
              (usedEnd(c) ? fd(usedEnd(c)) : "—") +
              "</dd><dt>メモ</dt><dd>" +
              (esc(c.memo) || "—") +
              '</dd></dl><div class="acts"><button class="btn p" data-copy="' +
              esc(c.id) +
              '">コードをコピー</button>' +
              (c.status !== "used"
                ? '<button class="btn" data-use="' + esc(c.id) + '">使用済みにする</button>'
                : '<button class="btn" data-unuse="' + esc(c.id) + '">未使用に戻す</button>') +
              '<button class="btn" data-remind="' +
              esc(c.id) +
              '">' +
              (c.cal ? "ICS作成済み" : "カレンダーに登録") +
              '</button><button class="btn" data-edit="' +
              esc(c.id) +
              '">編集</button><button class="btn d" data-del="' +
              esc(c.id) +
              '">削除</button><button class="btn" data-close>閉じる</button></div>'
          );
        }
        function confirmBox(msg, label, act) {
          sheet(
            '<p style="white-space:pre-line">' +
              esc(msg) +
              '</p><div class="acts"><button class="btn" data-close>キャンセル</button><button class="btn p" id="go">' +
              label +
              "</button></div>",
            true
          );
          $("#go").onclick = function () {
            act();
          };
        }
        function backup() {
          var j = JSON.stringify(
            { app: "povo-code-manager", version: 1, exportedAt: new Date().toISOString(), settings: S, codes: codes },
            null,
            1
          );
          sheet(
            '<h1>バックアップ</h1><p class="sub">下のJSONをコピーして安全な場所に保存してください。保存できる環境では .json ファイルも書き出します。コードが含まれるため取り扱いに注意してください。</p><textarea id="bk" rows="8" readonly style="font:12px ui-monospace,monospace">' +
              esc(j) +
              '</textarea><div class="acts"><button class="btn p" id="bkc">JSONをコピー</button><button class="btn" id="bkd">ファイルで保存</button><button class="btn" data-close>閉じる</button></div>'
          );
          $("#bkc").onclick = function () {
            copy(j);
          };
          $("#bkd").onclick = function () {
            try {
              var a = document.createElement("a");
              a.href = URL.createObjectURL(new Blob([j], { type: "application/json" }));
              a.download = "povo-code-manager-backup-" + loc().slice(0, 10) + ".json";
              document.body.appendChild(a);
              a.click();
              a.remove();
            } catch (e) {
              toast("保存できませんでした。コピーを使ってください");
            }
          };
        }
        function restore() {
          sheet(
            '<h1>バックアップを読み込む</h1><p class="sub">JSONファイルを選ぶか、JSONを貼り付けてください。同じIDのコードは上書きされます。</p><input type="file" id="rf" accept=".json,application/json"><label>またはJSONを貼り付け</label><textarea id="rt" rows="6"></textarea><p class="sub" id="err" style="color:var(--ex)"></p><div class="acts"><button class="btn" data-close>キャンセル</button><button class="btn p" id="rg">復元する</button></div>'
          );
          $("#rf").onchange = function (e) {
            var f = e.target.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function () {
              $("#rt").value = r.result;
            };
            r.readAsText(f);
          };
          $("#rg").onclick = function () {
            try {
              var d = JSON.parse($("#rt").value);
              if (!d || !Array.isArray(d.codes)) throw 0;
              var ps = d.codes
                .filter(function (c) {
                  return c && c.id && c.name && c.code && c.expiry;
                })
                .map(put);
              if (d.settings) {
                S = Object.assign(S, d.settings);
                saveS().then(applyTheme);
              }
              Promise.all(ps).then(
                function () {
                  close();
                  render();
                  toast("✓ " + ps.length + "件を復元しました");
                },
                function () {
                  $("#err").textContent = "保存に失敗しました。空き容量等をご確認ください。";
                }
              );
            } catch (e) {
              $("#err").textContent = "読み込めませんでした。povo Code Managerのバックアップ形式か確認してください。";
            }
          };
        }
        /* ---- events ---- */
        document.addEventListener("click", function (e) {
          var t = e.target,
            g = function (a) {
              var n = t.closest("[" + a + "]");
              return n ? n.getAttribute(a) : null;
            },
            v;
          if ((v = g("data-reveal")) !== null) {
            e.stopPropagation();
            revealed[v] = !revealed[v];
            if (revealTimers[v]) clearTimeout(revealTimers[v]);
            if (revealed[v]) {
              revealTimers[v] = setTimeout(function () {
                revealed[v] = false;
                delete revealTimers[v];
                var inSheet = $("#layer").querySelector('[data-reveal="' + v.replace(/"/g, '\\"') + '"]');
                if (inSheet) detail(v);
                else render();
              }, 8000);
            }
            if ($("#layer").querySelector("[data-reveal]")) detail(v);
            else render();
            return;
          }
          if ((v = g("data-copy"))) {
            e.stopPropagation();
            var c = codes.find(function (x) {
              return x.id === v;
            });
            if (c) {
              copy(c.code);
              if (c.status !== "used" && st(c, Date.now()) === "unused") askStart(c.id);
            }
            return;
          }
          if ((v = g("data-remind"))) {
            remind(v);
            return;
          }
          if ((v = g("data-addopt"))) {
            addOpt(v);
            return;
          }
          if (t.id === "ov" || t.closest("[data-close]")) {
            close();
            return;
          }
          if (t.closest("[data-add]")) {
            bulk();
            return;
          }
          if (t.closest("[data-single]")) {
            form();
            return;
          }
          if ((v = g("data-save")) !== null) {
            save(v);
            return;
          }
          if ((v = g("data-use"))) {
            var c1 = codes.find(function (x) {
              return x.id === v;
            });
            confirmBox(
              "このコードを使用済みにしますか？" +
                (durOf(c1)
                  ? "\n使用開始から" + durTxt(durOf(c1)) + "（" + fd(Date.now() + durOf(c1) * 864e5) + " まで）"
                  : ""),
              "使用済みにする",
              function () {
                var c9 = startUse(Object.assign({}, c1), Date.now());
                put(c9).then(function () {
                  close();
                  render();
                  toast("使用済みにしました");
                });
              }
            );
            return;
          }
          if ((v = g("data-unuse"))) {
            var c2 = codes.find(function (x) {
              return x.id === v;
            });
            c2.status = "unused";
            c2.usedAt = null;
            c2.remMs = null;
            c2.endAt = null;
            c2.cal = null;
            put(c2).then(function () {
              detail(v);
              render();
            });
            return;
          }
          if ((v = g("data-edit"))) {
            form(
              codes.find(function (x) {
                return x.id === v;
              })
            );
            return;
          }
          if ((v = g("data-del"))) {
            confirmBox("このコードを削除しますか？\nこの操作は元に戻せません。", "削除する", function () {
              del(v).then(function () {
                close();
                render();
              });
            });
            return;
          }
          if ((v = g("data-open"))) {
            detail(v);
            return;
          }
          if ((v = g("data-prod")) !== null) {
            prod = v;
            flt = "unused";
            view = "list";
            render();
            return;
          }
          if (t.closest("[data-clrprod]")) {
            prod = "";
            flt = "all";
            render();
            return;
          }
          if ((v = g("data-f"))) {
            flt = v;
            render();
            return;
          }
          if (t.closest("[data-export]")) {
            backup();
            return;
          }
          if (t.closest("[data-imp]")) {
            restore();
            return;
          }
          if (t.closest("[data-wipe]")) {
            confirmBox(
              "すべてのコード情報を削除します。\nこの操作は元に戻せません。\nバックアップを作成してから削除することをおすすめします。",
              "すべて削除",
              function () {
                clearAll().then(function () {
                  close();
                  render();
                  toast("削除しました");
                });
              }
            );
            return;
          }
        });

        $("#nav").addEventListener("click", function (e) {
          var b = e.target.closest("button[data-v]");
          if (!b) return;
          var next = b.getAttribute("data-v");
          if (!["home", "list", "hist", "set"].includes(next)) return;
          view = next;
          try {
            render();
            window.scrollTo(0, 0);
          } catch (err) {
            console.error("画面切替エラー:", err);
            toast("画面の表示に失敗しました。ページを再読み込みしてください。");
          }
        });
        document.addEventListener("input", function (e) {
          if (e.target.id === "q") {
            q = e.target.value;
            list();
          }
        });
        document.addEventListener("change", function (e) {
          var t = e.target;
          if (/-durx$/.test(t.id)) {
            var dv = parseDur(t.value),
              ds = $("#" + t.id.slice(0, -1));
            if (dv && ds) {
              setSel(ds, dv);
              t.value = "";
              ds.dispatchEvent(new Event("change"));
            } else if (t.value) toast("例：14日、36時間");
          }
          if (t.id === "sort") {
            sort = t.value;
            list();
          }
          if (t.id === "theme") {
            S.theme = t.value;
            applyTheme();
            saveS();
          }
          if (t.id === "near") {
            S.near = Math.max(1, parseInt(t.value) || 24);
            saveS();
          }
          if (t.id === "mask") {
            S.mask = t.checked;
            saveS();
            if (view === "hist") render();
          }
        });

        setInterval(function () {
          var now = Date.now(),
            expired = false;
          document.querySelectorAll("[data-exp]").forEach(function (el) {
            var l = new Date(el.dataset.exp).getTime() - now;
            if (!Number.isFinite(l) || l <= 0) {
              el.textContent = "期限切れ";
              el.classList.add("e");
              el.removeAttribute("data-exp");
              expired = true;
              return;
            }
            el.textContent = (el.dataset.pre || "残り ") + (el.dataset.d ? dy(l) : fmt(l));
          });
          if (expired) render();
        }, 1000);
        open()
          .then(loadAll)
          .then(function () {
            applyTheme();
            render();
          });
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("Service Worker登録成功", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker登録失敗", error);
            });
        });
      }
    </script>
  </body>
</html>
